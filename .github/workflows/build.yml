name: Build, test and package

on:
  push:
    branches: [trunk]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  validate-translation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check strings/PL and cinematic/PL against the EN originals
        run: python3 tools/validate_translation.py .

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S tools -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test (synthetic archive, no game data needed)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke test of the executable (no arguments prints the usage and exits with 1)
        shell: bash
        run: |
          exe=build/PolishPatcher
          [ "$RUNNER_OS" = "Windows" ] && exe=build/Release/PolishPatcher.exe
          set +e
          "$exe"
          [ $? -eq 1 ]

      - name: Collect the executables
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp build/Release/PolishPatcher.exe dist/
          else
            cp build/PolishPatcher dist/PolishPatcher-linux-x86_64
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PolishPatcher-${{ runner.os }}
          path: dist/*

      # The package holds only our texts and the font deltas; it is identical on every platform
      - name: Build the translation package
        if: runner.os == 'Linux'
        run: ./build/PolishPatcher pack . polish.pak

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: polish-package
          path: polish.pak

  installer:
    needs: [validate-translation, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PolishPatcher-Windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: polish-package
          path: .
      - name: Build the installer (Inno Setup is preinstalled on the runner)
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.0-dev" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DPatcherExe=..\dist\PolishPatcher.exe" "/DPackageFile=..\polish.pak" installer\lokdp.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/LoKDR-PL-Setup-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate-translation, build, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --generate-notes
